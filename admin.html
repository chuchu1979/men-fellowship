<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Men Fellowship</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0f172a;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px 16px;
        }

        .admin-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 20px;
        }

        .admin-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #ef4444;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .badge-admin {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid #ef4444;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .card {
            background: #1e293b;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #ffffff;
            font-size: 0.85rem;
            outline: none;
        }

        .btn-danger {
            width: 100%;
            padding: 12px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .msg-box {
            font-size: 0.85rem;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 14px;
            display: none;
            text-align: center;
        }

        .msg-error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
        .msg-success { background: rgba(34, 197, 94, 0.2); color: #86efac; border: 1px solid #22c55e; }
    </style>
</head>
<body>

    <div class="admin-container">
        <!-- Admin Header -->
        <div class="admin-header">
            <div>
                <div class="admin-title">Admin Panel</div>
                <div style="font-size: 0.75rem; color: #94a3b8;">Men Fellowship Control Center</div>
            </div>
            <span class="badge-admin">Admin Access</span>
        </div>

        <div id="msg-box" class="msg-box"></div>

        <!-- Admin Login Card -->
        <div class="card" id="admin-login-card">
            <div class="card-title">Admin Authentication</div>
            <form id="admin-login-form">
                <div class="form-group">
                    <label for="admin-phone">Admin Phone Number</label>
                    <input type="tel" id="admin-phone" placeholder="08012345678" required>
                </div>
                <div class="form-group">
                    <label for="admin-pin">Admin Security PIN</label>
                    <input type="password" id="admin-pin" maxlength="6" pattern="\d{6}" placeholder="******" required>
                </div>
                <button type="submit" class="btn-danger" id="admin-login-btn">Access Admin Dashboard</button>
            </form>
        </div>

        <!-- Admin Main View (Hidden by default) -->
        <div id="admin-main-view" style="display: none;">
            <div class="card">
                <div class="card-title">Welcome, Admin</div>
                <p style="font-size: 0.85rem; color: #cbd5e1;">You now have administrative access to manage members, payments, and projects.</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dgoanvhtgdkoqowwbddh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Msx99khN4c2O5hxMcdpfUw_7zB1U4LY';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const msgBox = document.getElementById('msg-box');

        function showMessage(text, isError = true) {
            msgBox.textContent = text;
            msgBox.className = 'msg-box ' + (isError ? 'msg-error' : 'msg-success');
            msgBox.style.display = 'block';
        }

        function hideMessage() {
            msgBox.style.display = 'none';
        }

        // Admin Login Handle
        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessage();

            const phone = document.getElementById('admin-phone').value.trim();
            const pin = document.getElementById('admin-pin').value.trim();
            const btn = document.getElementById('admin-login-btn');

            btn.disabled = true;
            btn.textContent = 'Verifying Admin...';

            try {
                const { data, error } = await _supabase
                    .from('members')
                    .select('*')
                    .eq('phone_number', phone)
                    .eq('pin_hash', pin)
                    .eq('role', 'admin')
                    .single();

                if (error || !data) {
                    showMessage('Access Denied: Invalid credentials or you are not an Admin.');
                } else {
                    document.getElementById('admin-login-card').style.display = 'none';
                    document.getElementById('admin-main-view').style.display = 'block';
                    showMessage('Admin access granted!', false);
                }
            } catch (err) {
                showMessage('Network error. Please check your connection.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Access Admin Dashboard';
            }
        });
    </script>
</body>
</html>
